name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A new RustSec advisory or a yank can turn a merged commit red without a push.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v2.87.19
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
        with:
          tool: just@1.58.0,cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-nextest@0.9.145

      - name: Install toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install "$(just --evaluate nightly)" --profile minimal --component rustfmt
          rustup default stable

      # v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - run: just lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v2.87.19
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
        with:
          tool: just@1.58.0,cargo-nextest@0.9.145

      # The hook corpus runs rg as the oracle for its rg cases; neither runner image ships it, and
      # install-action has no ripgrep manifest. The corpus and scenarios model GNU `sed -i`; BSD sed
      # reads the script as a backup suffix, so macOS gets GNU sed first on PATH.
      - name: Install ripgrep and GNU sed
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install ripgrep gnu-sed
            echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi

      # v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - run: just test

  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal

      # v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - run: cargo "+${{ steps.msrv.outputs.version }}" check --locked --all-targets

  bench:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v2.87.19
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
        with:
          tool: just@1.58.0

      - name: Install musl target and musl-gcc
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - run: just bench-gate

  release-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v2.87.19
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
        with:
          tool: just@1.58.0

      - name: Install musl target and musl-gcc
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install dist
        # dist is not a taiki-e/install-action tool.
        run: |
          version=$(sed -n 's/^cargo-dist-version = "\(.*\)"/\1/p' dist-workspace.toml)
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${version}/cargo-dist-installer.sh" | sh

      # v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - run: just release-check

  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v2.87.19
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
        with:
          tool: just@1.58.0,cargo-nextest@0.9.145

      # v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - run: just docs-check

  shellcheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v2.87.19
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
        with:
          tool: just@1.58.0

      - run: just shellcheck
