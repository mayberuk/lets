# No `set -e`: the script captures `lets`'s exit code before checking `.codex`.
bin.name = "sh"
args = ["-c", "export HOME=\"$(pwd)/home\"; export PATH=\"$(pwd)/fake-bin:$(dirname \"$CARGO_BIN_EXE_lets\"):$PATH\"; \"$CARGO_BIN_EXE_lets\" hooks install codex; status=$?; if [ -e \"$HOME/.codex\" ]; then echo unexpected-codex-dir-exists; else echo no-codex-dir-created; fi; exit \"$status\""]

[status]
code = 1

[fs]
sandbox = true
