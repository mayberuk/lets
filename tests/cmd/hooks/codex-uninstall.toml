bin.name = "sh"
args = ["-c", "set -e; export HOME=\"$(pwd)/home\"; f=\"$HOME/.codex/hooks.json\"; before=$(sha256sum \"$f\" | cut -d' ' -f1); export PATH=\"$(dirname \"$CARGO_BIN_EXE_lets\"):$PATH\"; \"$CARGO_BIN_EXE_lets\" hooks install codex >/dev/null; \"$CARGO_BIN_EXE_lets\" hooks uninstall codex; \"$CARGO_BIN_EXE_lets\" hooks uninstall codex; after=$(sha256sum \"$f\" | cut -d' ' -f1); if [ \"$before\" = \"$after\" ]; then echo 'hooks.json byte-identical after install then uninstall'; else echo 'hooks.json changed'; fi"]

[fs]
sandbox = true
