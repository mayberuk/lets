# `sh -c` rather than `bin.name = "lets"`: the tier's own `HOME` wins over a case's env on a shared
# key, so the case sets its sandboxed `HOME` itself, and puts the binary under test first on PATH
# because install refuses unless a bare `lets` resolves to it.
bin.name = "sh"
args = ["-c", "set -e; export HOME=\"$(pwd)/home\"; unset XDG_DATA_HOME; export PATH=\"$(dirname \"$CARGO_BIN_EXE_lets\"):$PATH\"; \"$CARGO_BIN_EXE_lets\" hooks install claude-code; cd \"$HOME/.local/share/lets/claude-code\"; find . -type f | LC_ALL=C sort; for f in $(find . -type f); do cmp -s \"$f\" \"$CARGO_MANIFEST_DIR/mod/$f\" || echo \"differs from mod/: $f\"; done; cd \"$HOME\"; echo plugin dirs: $(grep -F CLAUDE_CODE_PLUGIN_DIRS .claude/settings.json | cut -d'\"' -f4); echo start hooks: $(grep -c -E '\"(SessionStart|SubagentStart)\": \\[' .claude/settings.json || true)"]

[fs]
sandbox = true
