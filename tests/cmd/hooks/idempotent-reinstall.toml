# Compares hashes rather than a byte-exact golden, so jsonc-parser's formatting stays its own.
bin.name = "sh"
args = ["-c", "set -e; export HOME=\"$(pwd)/home\"; unset XDG_DATA_HOME; export PATH=\"$(dirname \"$CARGO_BIN_EXE_lets\"):$PATH\"; \"$CARGO_BIN_EXE_lets\" hooks install claude-code; hash1=$(sha256sum \"$HOME/.claude/settings.json\" | cut -d' ' -f1); mods1=$(cat \"$HOME\"/.local/share/lets/claude-code/.claude-plugin/plugin.json \"$HOME\"/.local/share/lets/claude-code/hooks/* \"$HOME\"/.local/share/lets/claude-code/tsconfig.json | sha256sum); \"$CARGO_BIN_EXE_lets\" hooks install claude-code; hash2=$(sha256sum \"$HOME/.claude/settings.json\" | cut -d' ' -f1); if [ \"$hash1\" = \"$hash2\" ]; then echo 'settings.json byte-identical across reinstall'; else echo 'settings.json changed across reinstall'; fi; mods2=$(cat \"$HOME\"/.local/share/lets/claude-code/.claude-plugin/plugin.json \"$HOME\"/.local/share/lets/claude-code/hooks/* \"$HOME\"/.local/share/lets/claude-code/tsconfig.json | sha256sum); if [ \"$mods1\" = \"$mods2\" ]; then echo 'mod files byte-identical across reinstall'; else echo 'mod files changed across reinstall'; fi"]

[fs]
sandbox = true
