# The hooks run a bare `lets`, so installing from a binary PATH does not reach would wire hooks
# that cannot run. No `set -e`: the script captures `lets`'s exit code before checking `.claude`.
bin.name = "sh"
args = ["-c", "export HOME=\"$(pwd)/home\"; export PATH=\"$(pwd)/empty\"; \"$CARGO_BIN_EXE_lets\" hooks install claude-code; status=$?; if [ -e \"$HOME/.claude\" ]; then echo unexpected-claude-dir-exists; else echo no-claude-dir-created; fi; exit \"$status\""]

[status]
code = 1

[fs]
sandbox = true
