# No `set -e`: the script captures `lets`'s exit code before checking `.claude`.
bin.name = "sh"
args = ["-c", "export HOME=\"$(pwd)/home\"; unset XDG_DATA_HOME; export PATH=\"$(pwd)/fake-bin:$(dirname \"$CARGO_BIN_EXE_lets\"):$PATH\"; \"$CARGO_BIN_EXE_lets\" hooks install claude-code; status=$?; if [ -e \"$HOME/.claude\" ]; then echo unexpected-claude-dir-exists; else echo no-claude-dir-created; fi; if [ -e \"$HOME/.local/share/lets\" ]; then echo unexpected-mod-dir-exists; else echo no-mod-dir-created; fi; exit \"$status\""]

[status]
code = 1

[fs]
sandbox = true
