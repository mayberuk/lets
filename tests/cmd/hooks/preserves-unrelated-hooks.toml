# Lines 1-12 of the fixture, its comment and the teammate's PreToolUse element up to the brace
# that gains a comma, must come out byte-identical, with the one `lets` command added beside them.
bin.name = "sh"
args = ["-c", "set -e; export HOME=\"$(pwd)/home\"; unset XDG_DATA_HOME; export PATH=\"$(dirname \"$CARGO_BIN_EXE_lets\"):$PATH\"; f=\"$HOME/.claude/settings.json\"; head -n 12 \"$f\" > before; \"$CARGO_BIN_EXE_lets\" hooks install claude-code >/dev/null; if head -n 12 \"$f\" | cmp -s - before; then echo unrelated-entry-byte-identical; else echo unrelated-entry-changed; fi; grep -c -F 'then out=$(lets hook classify 2>/dev/null && printf .)' \"$f\""]

[fs]
sandbox = true
