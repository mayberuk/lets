# `mine.ts` stands for a file lets did not write: it and its directory stay.
bin.name = "sh"
args = ["-c", "set -e; export HOME=\"$(pwd)/home\"; unset XDG_DATA_HOME; export PATH=\"$(dirname \"$CARGO_BIN_EXE_lets\"):$PATH\"; \"$CARGO_BIN_EXE_lets\" hooks install claude-code >/dev/null; echo theirs > \"$HOME/.local/share/lets/claude-code/hooks/mine.ts\"; PATH=/nonexistent \"$CARGO_BIN_EXE_lets\" hooks uninstall claude-code; find home/.local -type f | LC_ALL=C sort; echo plugin dirs: $(grep -F CLAUDE_CODE_PLUGIN_DIRS \"$HOME/.claude/settings.json\" | cut -d'\"' -f4)"]

[fs]
sandbox = true
