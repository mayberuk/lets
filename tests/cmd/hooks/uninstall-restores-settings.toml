# Uninstall runs with an empty PATH: removing the entries needs no `lets` to resolve.
bin.name = "sh"
args = ["-c", "set -e; export HOME=\"$(pwd)/home\"; f=\"$HOME/.claude/settings.json\"; before=$(sha256sum \"$f\" | cut -d' ' -f1); export PATH=\"$(dirname \"$CARGO_BIN_EXE_lets\"):$PATH\"; \"$CARGO_BIN_EXE_lets\" hooks install claude-code >/dev/null; PATH=/nonexistent \"$CARGO_BIN_EXE_lets\" hooks uninstall claude-code; after=$(sha256sum \"$f\" | cut -d' ' -f1); if [ \"$before\" = \"$after\" ]; then echo 'settings.json byte-identical after install then uninstall'; else echo 'settings.json changed'; fi"]

[fs]
sandbox = true
