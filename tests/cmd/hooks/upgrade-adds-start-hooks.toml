# The fixture is the hooks a 0.0.4 to 0.0.6 install left: the classify hook and no start hooks.
bin.name = "sh"
args = ["-c", "set -e; export HOME=\"$(pwd)/home\"; unset XDG_DATA_HOME; export PATH=\"$(dirname \"$CARGO_BIN_EXE_lets\"):$PATH\"; \"$CARGO_BIN_EXE_lets\" hooks install claude-code; f=\"$HOME/.claude/settings.json\"; echo start hooks: $(grep -c -E '\"(SessionStart|SubagentStart)\": \\[' \"$f\" || true); echo classify hooks: $(grep -c -F 'lets hook classify' \"$f\")"]

[fs]
sandbox = true
