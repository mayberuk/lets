# The control for set-quoted-literal-key: unquoted, the dot still splits, and with no literal
# `editor.formatOnSave` key to match, `formatOnSave` nests under `editor` as it always has.
# set-unquoted-dotted-key-matches-literal-json is the case where that literal key exists instead.
bin.name = "lets"
args = ["transform", "c.json", "--set", "editor.formatOnSave=true"]
