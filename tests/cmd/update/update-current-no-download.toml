# The call log after `lets update` must hold the one lookup and no download.
bin.name = "sh"
args = ["-c", "export PATH=\"$(pwd)/fake-bin:$(dirname \"$CARGO_BIN_EXE_lets\"):$PATH\"; export FAKE_CURL_LOG=\"$(pwd)/curl-calls\"; export FAKE_LATEST_TAG=\"v$(\"$CARGO_BIN_EXE_lets\" --version | cut -d' ' -f2)\"; \"$CARGO_BIN_EXE_lets\" update; cat curl-calls"]

[fs]
sandbox = true
