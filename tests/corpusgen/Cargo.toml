[package]
name = "corpusgen"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "corpusgen"
path = "src/lib.rs"

[[bin]]
name = "corpusgen"
path = "src/main.rs"

# Empty: std only, so the generator stays outside the binary's 17-dependency gate.
[dependencies]

# Copied from the root `Cargo.toml`: the corpus is only useful if the grammars the binary
# links parse it.
[dev-dependencies]
tree-sitter = "0.26.13"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
